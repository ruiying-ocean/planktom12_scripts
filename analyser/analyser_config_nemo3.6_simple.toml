# ============================================================================
# ANALYSER CONFIGURATION FILE: PlankTOM-SIMPLE (NEMO3.6)
# ============================================================================
#
# PlankTOM-SIMPLE counterpart of analyser_config_nemo3.6.toml. The [files] and
# [coordinates] blocks are identical to the NEMO3.6 config; the variable list
# follows the SIMPLE tracer set (16 tracers):
#   - one phytoplankton (PHY), one zooplankton (ZOO), bacteria (BAC)
#   - no PO4, Si, DSi, BSi, aragonite or HOC tracers
#   - community calcification is diagnosed as procal (TOM12: prococ + proara)
#   - zooplankton grazing on all food is GRAZOO (TOM12: GRAPRO, GRAMES, ...)
#
# See analyser_config_nemo3.6.toml for the region-mask documentation; region=
# entries work here the same way.
#
# ============================================================================

[files]
basin_mask = "/gpfs/data/greenocean/software/resources/breakdown/basin_mask.nc"
mesh_mask = "/gpfs/data/greenocean/software/resources/breakdown/mesh_mask3_6_low_res.nc"
woa_mask = "/gpfs/data/greenocean/software/resources/breakdown/WOAmask.nc"
region_mask = "/gpfs/data/greenocean/software/resources/breakdown/clq_basin_masks_ORCA.nc"
reccap_mask = "/gpfs/data/greenocean/software/resources/breakdown/RECCAP2_region_masks_all_v20210412_ORCA.nc"
ancillary_data = "/gpfs/data/greenocean/software/resources/breakdown/AncillaryData_v2.nc"

[coordinates]
lat_names = [ "nav_lat" ]
lon_names = [ "nav_lon" ]

[[surface]]
variable = "Cflx"
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[level]]
variable = "EXP"
depth_m = 100.0
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[level]]
variable = "ExpCO3"
depth_m = 100.0
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[level]]
variable = "EXP"
depth_m = 1000.0
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]
key = "exp_1000m_global"
column_name = "EXP1000"

[[volume]]
variable = "PPT"
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[volume]]
variable = "PPT"
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -30, 30 ]
column_name = "PPT_Trop"

# Primary production by the single phytoplankton
[[volume]]
variable = "PPT_PHY"
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

# Community calcite production (rn_coccal x PHY production)
[[volume]]
variable = "procal"
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

# Zooplankton grazing on all food sources (secondary production)
[[volume]]
variable = "GRAZOO"
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

# Zooplankton grazing on phytoplankton only
[[volume]]
variable = "GRAZOOPHY"
units = "PgCarbonPerYr"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[integration]]
variable = "PHY"
depth_from_m = 0.0
depth_to_m = 200.0
units = "Conc->PgCarbon"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[integration]]
variable = "ZOO"
depth_from_m = 0.0
depth_to_m = 200.0
units = "Conc->PgCarbon"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[integration]]
variable = "BAC"
depth_from_m = 0.0
depth_to_m = 200.0
units = "Conc->PgCarbon"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

# SO biomass (90S-45S)
[[integration]]
variable = "PHY"
depth_from_m = 0.0
depth_to_m = 200.0
units = "Conc->PgCarbon"
lon_range = [ -180, 180 ]
lat_range = [ -90, -45 ]
column_name = "PHY_SO"

[[integration]]
variable = "ZOO"
depth_from_m = 0.0
depth_to_m = 200.0
units = "Conc->PgCarbon"
lon_range = [ -180, 180 ]
lat_range = [ -90, -45 ]
column_name = "ZOO_SO"

[[integration]]
variable = "BAC"
depth_from_m = 0.0
depth_to_m = 200.0
units = "Conc->PgCarbon"
lon_range = [ -180, 180 ]
lat_range = [ -90, -45 ]
column_name = "BAC_SO"

[[integration]]
variable = "DOC"
depth_from_m = 0.0
depth_to_m = 200.0
units = "Conc->PgCarbon"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[integration]]
variable = "POC"
depth_from_m = 0.0
depth_to_m = 200.0
units = "Conc->PgCarbon"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[integration]]
variable = "GOC"
depth_from_m = 0.0
depth_to_m = 200.0
units = "Conc->PgCarbon"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "TChl"
depth_from_m = 0.0
depth_to_m = 0.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "NO3"
depth_from_m = 0.0
depth_to_m = 0.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "Fer"
depth_from_m = 0.0
depth_to_m = 0.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "O2"
depth_from_m = 270.0
depth_to_m = 300.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "tos"
depth_from_m = 0.0
depth_to_m = 0.0
units = "1"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "sos"
depth_from_m = 0.0
depth_to_m = 0.0
units = "1"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "mldr10_1"
depth_from_m = 0.0
depth_to_m = 0.0
units = "1"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "pCO2"
depth_from_m = 0.0
depth_to_m = 0.0
units = "1"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "Alkalini"
depth_from_m = 0.0
depth_to_m = 0.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

[[average]]
variable = "DIC"
depth_from_m = 0.0
depth_to_m = 0.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]

# Deep-ocean (benthic) averages (>2000m)
[[average]]
variable = "NO3"
depth_from_m = 2000.0
depth_to_m = 5000.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]
column_name = "bNO3"

[[average]]
variable = "O2"
depth_from_m = 2000.0
depth_to_m = 5000.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]
column_name = "bO2"

[[average]]
variable = "Fer"
depth_from_m = 2000.0
depth_to_m = 5000.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]
column_name = "bFer"

[[average]]
variable = "DIC"
depth_from_m = 2000.0
depth_to_m = 5000.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]
column_name = "bDIC"

[[average]]
variable = "Alkalini"
depth_from_m = 2000.0
depth_to_m = 5000.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]
column_name = "bAlkalini"

[[average]]
variable = "DOC"
depth_from_m = 2000.0
depth_to_m = 5000.0
units = "u/L"
lon_range = [ -180, 180 ]
lat_range = [ -90, 90 ]
column_name = "bDOC"

# AOU configuration (derived variable, computed from O2 + T + S)
[[aou]]
target_depth_m = 300.0
column_name = "AOU"
